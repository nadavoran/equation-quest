<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f6ff"/>
      <stop offset="100%" stop-color="#ede9ff"/>
    </linearGradient>
  </defs>

  <!-- Soft white-purple background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="18" y="18" width="988" height="988" rx="208" ry="208" fill="none" stroke="#2d2d3a" stroke-width="6" opacity="0.08"/>

  <!-- "5" left -->
  <text x="300" y="590" font-family="-apple-system, system-ui, Helvetica Neue, sans-serif"
        font-size="420" font-weight="900" fill="#2d2d3a" text-anchor="middle">5</text>

  <!-- "+" operator — slightly lighter -->
  <text x="512" y="480" font-family="-apple-system, system-ui, Helvetica Neue, sans-serif"
        font-size="200" font-weight="700" fill="#2d2d3a" opacity="0.35" text-anchor="middle">+</text>

  <!-- "3" right -->
  <text x="724" y="590" font-family="-apple-system, system-ui, Helvetica Neue, sans-serif"
        font-size="420" font-weight="900" fill="#2d2d3a" text-anchor="middle">3</text>
</svg>
